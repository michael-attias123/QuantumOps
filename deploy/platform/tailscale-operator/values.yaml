# Tailscale Kubernetes operator: exposes cluster services on the tailnet (HTTPS at <name>.<tailnet>.ts.net).
# OAuth credentials: the tailscale/operator-oauth Secret. ESO creates it from the shared Vault
# (kv/quantumops/tailscale, seeded from infra/oci's tailscale_oauth_client by `make seed-secrets`).

operatorConfig:
  hostname: qops-k8s-operator
  defaultTags:
    - "tag:k8s-operator"
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }

proxyConfig:
  defaultTags: "tag:k8s"

ingressClass:
  enabled: true
  name: tailscale

# Kubernetes API access stays on the node's tailnet IP (P2); no extra API proxy.
apiServerProxyConfig:
  mode: "false"
