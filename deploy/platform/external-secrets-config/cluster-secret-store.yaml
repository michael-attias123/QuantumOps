# The shared Vault, for every namespace (ADR 0013). ESO asks Kubernetes for a short-lived token of its own service
# account (audience "vault") and logs in on the JWT mount that trusts this cluster's service-account key. The
# role and its read policy (kv/quantumops/*) come from shared-platform's projects/quantumops.yaml.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://vault.158-178-129-140.sslip.io
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-k8s-qops
          role: quantumops-external-secrets-external-secrets
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-secrets
              namespace: external-secrets
              audiences: [vault]
            expirationSeconds: 600
