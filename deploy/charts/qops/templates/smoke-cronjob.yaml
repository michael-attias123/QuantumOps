{{- if .Values.smoke.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qops-smoke
  labels:
    app.kubernetes.io/name: qops-smoke
    app.kubernetes.io/part-of: quantumops
spec:
  schedule: {{ .Values.smoke.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qops-smoke
        spec:
          restartPolicy: Never
          nodeSelector:
            qops.io/pool: cpu
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: qops
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["run", "--local", {{ .Values.smoke.algorithm | quote }}, "--state-dir", "/tmp/qops", "--json"]
              env:
                - name: HOME
                  value: /tmp
              resources:
                {{- toYaml .Values.smoke.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
