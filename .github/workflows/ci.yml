name: ci

on:
  pull_request:
  push:
    branches: [main, "phase/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint & test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace
        run: uv sync --locked
      - name: Lint (ruff, mypy, yamllint)
        run: make lint
      - name: Test
        run: make test
      - name: CLI smoke test
        run: uv run qops --version

  compat:
    name: pin matrix (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install workspace with compat group
        run: uv sync --locked --group compat
      - name: Qiskit 2.x + mthree, mitiq, provider SDKs
        run: uv run --locked --group compat pytest -q tests/test_compat_matrix.py
      - name: Local runs (GHZ, VQE-H2)
        run: |
          uv run --locked qops run --local research/algorithms/ghz_benchmark
          uv run --locked qops run --local research/algorithms/vqe_h2

  infra:
    name: opentofu (infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: fmt, validate, tests with mocked providers (no credentials)
        run: bash infra/scripts/tofu.sh check

  deploy:
    name: deploy manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install kubeconform
        run: |
          base=https://github.com/yannh/kubeconform/releases/download/v0.7.0
          curl -fsSL "$base/kubeconform-linux-amd64.tar.gz" -o /tmp/kc.tgz
          echo "$(curl -fsSL "$base/CHECKSUMS" | awk '$2 == "kubeconform-linux-amd64.tar.gz" {print $1}')  /tmp/kc.tgz" | sha256sum --check
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: helm lint, render each env, kubeconform
        run: bash deploy/bootstrap/scripts/check.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/linters/gitleaks.toml
