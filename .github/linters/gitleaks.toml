title = "QuantumOps gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Copied reference material and lockfiles carry no secrets"
paths = [
  '''docs/reference/''',
  '''uv\.lock''',
]

# ExternalSecret remoteRef keys are Vault path names (kv/<project>/<path>), never values.
regexes = [
  '''^quantumops/[a-z0-9/_-]+$''',
]
