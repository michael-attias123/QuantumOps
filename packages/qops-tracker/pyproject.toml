[project]
name = "qops-tracker"
version = "0.0.1"
description = "Remote job tracker (QPU + GPU) with transactional outbox dispatcher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["qops-core", "qops-providers"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qops-core = { workspace = true }
qops-providers = { workspace = true }
