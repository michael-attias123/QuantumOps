[project]
name = "qops-core"
version = "0.0.1"
description = "Core models, researcher contract loader, state serialization and store interfaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "qiskit>=2.1,<3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
