[project]
name = "qops-cli"
version = "0.0.1"
description = "The qops command-line interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qops-core",
    "qops-runtime",
]

[project.scripts]
qops = "qops_cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qops-core = { workspace = true }
qops-runtime = { workspace = true }
