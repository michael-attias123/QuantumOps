[project]
name = "qops-runtime"
version = "0.0.1"
description = "Workflow entrypoints for L1 (prepare/submit) and L3 (postprocess/finalize)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["qops-core", "qops-providers", "qops-stages"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qops-core = { workspace = true }
qops-providers = { workspace = true }
qops-stages = { workspace = true }
